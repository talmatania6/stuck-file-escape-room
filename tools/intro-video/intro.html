<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Ping intro renderer</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #000; color: #ccc; font-family: Heebo, sans-serif; }
  canvas { display: block; width: 100vw; height: auto; }
  #status { position: fixed; top: 4px; left: 6px; font: 12px monospace; color: #6f6; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="status"></div>
<script>
/* ------------------------------------------------------------------
   "Ping" intro for The Stuck File – every frame is a pure function of t.
   ?t=12.3  -> draw one frame (preview)      ?play=1 -> real-time preview
   ?render=1 -> render all frames + music and send them to the local server
------------------------------------------------------------------- */
const W = 1280, H = 720, FPS = 30, DUR = 36.6;
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const statusEl = document.getElementById('status');
const IMG = {};
let TL = [];

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sm = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
function rng(s) { return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
/** 0→1→0 window: fade in over f at a, out over f at b */
const win = (t, a, b, f = 0.4) => sm(seg(t, a, a + f)) * (1 - sm(seg(t, b - f, b)));

const CUTS = [4.2, 12.8, 19.45, 25.8, 29.2];
const LAYERS = [
  ['PHYSICAL', 'פיזית'], ['DATA LINK', 'קו'], ['NETWORK', 'רשת'], ['TRANSPORT', 'תעבורה'],
  ['SESSION', 'שיחה'], ['PRESENTATION', 'ייצוג'], ['APPLICATION', 'יישום'],
];
const LIGHT_T = (i) => 14.7 + i * 0.6;      // layer i lights up (scene 3)
const REPAIR_T = (i) => 23.75 + i * 0.2;    // layer i repaired (scene 4)

/* ---------- precomputed decor ---------- */
const R = rng(7);
const DUST = Array.from({ length: 140 }, () => ({ x: R() * W, y: R() * H, z: 0.3 + R() * 0.7, s: R() * 6.28 }));
const STREAMS = Array.from({ length: 9 }, (_, i) => ({
  y0: 80 + R() * 560, y1: 80 + R() * 560, c1: R() * H, c2: R() * H, speed: 0.08 + R() * 0.12, off: R(), hue: R() > 0.7 ? 'coral' : 'teal',
}));

/* ---------- drawing helpers ---------- */
function bez(p0, p1, p2, p3, k) {
  const u = 1 - k;
  return [
    u * u * u * p0[0] + 3 * u * u * k * p1[0] + 3 * u * k * k * p2[0] + k * k * k * p3[0],
    u * u * u * p0[1] + 3 * u * u * k * p1[1] + 3 * u * k * k * p2[1] + k * k * k * p3[1],
  ];
}

function background(t, tint = 0) {
  const grad = g.createRadialGradient(W / 2, H * 0.45, 60, W / 2, H * 0.5, W * 0.75);
  grad.addColorStop(0, tint ? '#1a1220' : '#13233a');
  grad.addColorStop(1, '#04070c');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);
}

function gridFloor(t, alpha = 1, color = '63,208,224') {
  if (alpha <= 0) return;
  g.save();
  const hz = H * 0.58;
  g.globalAlpha = alpha;
  for (let i = -16; i <= 16; i++) {
    const x = W / 2 + i * 90;
    g.strokeStyle = `rgba(${color},${0.10 - Math.abs(i) * 0.004})`;
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(W / 2 + i * 8, hz); g.lineTo(x * 1.0 + (x - W / 2) * 2.5, H); g.stroke();
  }
  const scroll = (t * 0.35) % 1;
  for (let k = 0; k < 14; k++) {
    const d = (k + scroll) / 14;
    const y = hz + Math.pow(d, 2.2) * (H - hz);
    g.strokeStyle = `rgba(${color},${0.03 + d * 0.12})`;
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  const fog = g.createLinearGradient(0, hz - 40, 0, hz + 120);
  fog.addColorStop(0, 'rgba(4,7,12,0)');
  fog.addColorStop(0.4, 'rgba(19,35,58,0.55)');
  fog.addColorStop(1, 'rgba(4,7,12,0)');
  g.fillStyle = fog;
  g.fillRect(0, hz - 40, W, 160);
  g.restore();
}

function dust(t, alpha = 1, color = '180,230,240') {
  g.save();
  for (const d of DUST) {
    const x = (d.x + t * 12 * d.z) % W;
    const y = (d.y - t * 6 * d.z + H) % H;
    const a = (0.25 + 0.35 * Math.sin(t * 1.5 + d.s)) * d.z * alpha;
    g.fillStyle = `rgba(${color},${clamp(a)})`;
    g.fillRect(x, y, 1.6 * d.z, 1.6 * d.z);
  }
  g.restore();
}

function streams(t, alpha = 1) {
  g.save();
  g.lineCap = 'round';
  for (const s of STREAMS) {
    const p0 = [-60, s.y0], p1 = [W * 0.33, s.c1], p2 = [W * 0.66, s.c2], p3 = [W + 60, s.y1];
    g.strokeStyle = `rgba(63,208,224,${0.05 * alpha})`;
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(...p0); g.bezierCurveTo(...p1, ...p2, ...p3); g.stroke();
    for (let k = 0; k < 3; k++) {
      const u = (t * s.speed + s.off + k / 3) % 1;
      const [x, y] = bez(p0, p1, p2, p3, u);
      const col = s.hue === 'coral' ? '239,138,128' : '120,235,245';
      const rg = g.createRadialGradient(x, y, 0, x, y, 14);
      rg.addColorStop(0, `rgba(${col},${0.8 * alpha})`);
      rg.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = rg;
      g.fillRect(x - 14, y - 14, 28, 28);
    }
  }
  g.restore();
}

/* ---------- Ping ---------- */
const off = document.createElement('canvas');
const ox = off.getContext('2d');
function drawPing(name, cx, by, h, { alpha = 1, reveal = 1, glow = 1, t = 0 } = {}) {
  const im = IMG[name];
  if (!im || alpha <= 0.001) return;
  const w = h * im.width / im.height;
  off.width = Math.ceil(w) + 2;
  off.height = Math.ceil(h) + 2;
  ox.clearRect(0, 0, off.width, off.height);
  ox.drawImage(im, 1, 1, w, h);
  if (reveal < 1) ox.clearRect(0, 0, off.width, h * (1 - reveal) + 1);
  // hologram scanlines + faint coral tint
  ox.globalCompositeOperation = 'destination-out';
  ox.fillStyle = 'rgba(0,0,0,0.16)';
  const shift = (t * 40) % 4;
  for (let y = shift; y < off.height; y += 4) ox.fillRect(0, y, off.width, 1.4);
  ox.globalCompositeOperation = 'source-atop';
  ox.fillStyle = 'rgba(255,150,140,0.05)';
  ox.fillRect(0, 0, off.width, off.height);
  ox.globalCompositeOperation = 'source-over';
  g.save();
  g.globalAlpha = alpha;
  g.shadowColor = `rgba(239,138,128,${0.5 * glow})`;
  g.shadowBlur = 26 * glow;
  g.drawImage(off, cx - w / 2, by - h);
  g.restore();
  if (reveal > 0 && reveal < 1) {
    const y = by - h * reveal;
    const lg = g.createLinearGradient(cx - w * 0.7, 0, cx + w * 0.7, 0);
    lg.addColorStop(0, 'rgba(255,170,160,0)');
    lg.addColorStop(0.5, 'rgba(255,210,200,0.95)');
    lg.addColorStop(1, 'rgba(255,170,160,0)');
    g.fillStyle = lg;
    g.fillRect(cx - w * 0.7, y - 1.5, w * 1.4, 3);
  }
}
/** Ping turning: crossfade between two sheet angles. */
function drawPingTurn(a, b, k, cx, by, h, o = {}) {
  if (k < 1) drawPing(a, cx, by, h, { ...o, alpha: (o.alpha ?? 1) * (1 - k) });
  if (k > 0) drawPing(b, cx, by, h, { ...o, alpha: (o.alpha ?? 1) * k });
}

function projector(cx, by, s, t, alpha = 1) {
  if (alpha <= 0) return;
  g.save();
  g.globalAlpha = alpha;
  g.translate(cx, by);
  g.scale(s, s);
  const pool = g.createRadialGradient(0, 0, 0, 0, 0, 170);
  pool.addColorStop(0, 'rgba(239,138,128,0.45)');
  pool.addColorStop(1, 'rgba(239,138,128,0)');
  g.fillStyle = pool;
  g.beginPath(); g.ellipse(0, 0, 170, 46, 0, 0, 6.283); g.fill();
  g.fillStyle = '#1c1f24';
  g.beginPath(); g.ellipse(0, 6, 92, 22, 0, 0, 6.283); g.fill();
  g.strokeStyle = '#b9c0c7';
  g.lineWidth = 3;
  g.beginPath(); g.ellipse(0, 0, 84, 19, 0, 0, 6.283); g.stroke();
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * 6.283 + t * 0.9;
    const on = i % 4 === 0 ? 1 : 0.5;
    g.fillStyle = `rgba(255,${140 + on * 60},${130 + on * 50},${0.5 + on * 0.5})`;
    g.beginPath(); g.ellipse(Math.cos(a) * 66, Math.sin(a) * 15, 5, 2, 0, 0, 6.283); g.fill();
  }
  const lens = g.createRadialGradient(0, 0, 0, 0, 0, 44);
  lens.addColorStop(0, 'rgba(255,230,220,1)');
  lens.addColorStop(1, 'rgba(160,50,50,0.9)');
  g.fillStyle = lens;
  g.beginPath(); g.ellipse(0, 0, 44, 10, 0, 0, 6.283); g.fill();
  // beam
  const beam = g.createLinearGradient(0, 0, 0, -560);
  beam.addColorStop(0, 'rgba(255,170,160,0.22)');
  beam.addColorStop(1, 'rgba(255,170,160,0)');
  g.fillStyle = beam;
  g.beginPath(); g.moveTo(-44, 0); g.lineTo(-110, -560); g.lineTo(110, -560); g.lineTo(44, 0); g.closePath(); g.fill();
  g.restore();
}

/* ---------- text ---------- */
function text(str, x, y, { size = 32, weight = 700, font = 'Heebo', color = '#fff', align = 'center', alpha = 1, dir = 'rtl', glow = 0, glowColor = color, spacing = 0 } = {}) {
  if (alpha <= 0) return;
  g.save();
  g.globalAlpha = alpha;
  g.font = `${weight} ${size}px ${font}, sans-serif`;
  g.direction = dir;
  g.textAlign = align;
  g.textBaseline = 'middle';
  if (spacing) g.letterSpacing = `${spacing}px`;
  if (glow) { g.shadowColor = glowColor; g.shadowBlur = glow; }
  g.fillStyle = color;
  g.fillText(str, x, y);
  g.restore();
}
function roundRect(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function subtitles(t) {
  for (const l of TL) {
    const a = win(t, l.start - 0.05, l.start + l.dur - 0.25, 0.18);
    if (a <= 0) continue;
    g.save();
    g.font = '600 31px Heebo, sans-serif';
    g.direction = 'rtl';
    const w = Math.min(W - 120, g.measureText(l.text).width + 56);
    g.globalAlpha = a;
    g.fillStyle = 'rgba(6,9,14,0.72)';
    roundRect(W / 2 - w / 2, H - 92, w, 56, 14);
    g.fill();
    g.fillStyle = 'rgba(239,138,128,0.9)';
    g.fillRect(W / 2 + w / 2 - 5, H - 82, 3, 36);
    g.restore();
    text(l.text, W / 2, H - 63, { size: 31, weight: 600, alpha: a });
  }
}

/* ---------- scene pieces ---------- */
function nodeIcon(x, y, label, kind, t, alpha) {
  g.save();
  g.globalAlpha = alpha;
  const rg = g.createRadialGradient(x, y, 0, x, y, 70);
  rg.addColorStop(0, 'rgba(63,208,224,0.35)');
  rg.addColorStop(1, 'rgba(63,208,224,0)');
  g.fillStyle = rg; g.fillRect(x - 70, y - 70, 140, 140);
  g.fillStyle = '#0e1a26';
  g.strokeStyle = '#7fe6f0';
  g.lineWidth = 2.5;
  g.beginPath(); g.arc(x, y, 40, 0, 6.283); g.fill(); g.stroke();
  g.strokeStyle = '#dff8fb';
  g.lineWidth = 2.5;
  if (kind === 'laptop') {
    g.strokeRect(x - 18, y - 14, 36, 22); g.beginPath(); g.moveTo(x - 24, y + 13); g.lineTo(x + 24, y + 13); g.stroke();
  } else {
    g.beginPath(); g.moveTo(x - 22, y - 6); g.lineTo(x, y - 16); g.lineTo(x + 22, y - 6); g.lineTo(x, y + 4); g.closePath(); g.stroke();
    g.beginPath(); g.moveTo(x - 12, y); g.lineTo(x - 12, y + 12); g.quadraticCurveTo(x, y + 18, x + 12, y + 12); g.lineTo(x + 12, y); g.stroke();
  }
  g.restore();
  text(label, x, y + 66, { size: 22, weight: 600, color: '#c9e9ee', alpha });
}

function fileIcon(x, y, s, red, alpha, jitter = 0) {
  g.save();
  g.globalAlpha = alpha;
  g.translate(x + jitter, y);
  g.scale(s, s);
  g.shadowColor = red ? 'rgba(239,109,115,0.9)' : 'rgba(255,207,138,0.8)';
  g.shadowBlur = 24;
  g.fillStyle = red ? '#3a1416' : '#f4efe4';
  g.beginPath(); g.moveTo(-22, -30); g.lineTo(10, -30); g.lineTo(22, -18); g.lineTo(22, 30); g.lineTo(-22, 30); g.closePath(); g.fill();
  g.shadowBlur = 0;
  g.strokeStyle = red ? '#ef6d73' : '#c9b48a';
  g.lineWidth = 2;
  g.stroke();
  g.fillStyle = red ? '#ef6d73' : '#9aa7b3';
  for (let i = 0; i < 4; i++) g.fillRect(-14, -10 + i * 9, i === 3 ? 18 : 28, 3);
  g.restore();
}

function ledBox(cx, cy, str, scale, alpha, { label = '', color = '#ffb547' } = {}) {
  if (alpha <= 0) return;
  g.save();
  g.globalAlpha = alpha;
  g.translate(cx, cy);
  g.scale(scale, scale);
  const w = 420, h = 170;
  const bg = g.createLinearGradient(0, -h / 2, 0, h / 2);
  bg.addColorStop(0, '#1a1208'); bg.addColorStop(1, '#0d0904');
  g.fillStyle = bg;
  g.shadowColor = 'rgba(255,140,40,0.45)';
  g.shadowBlur = 40;
  roundRect(-w / 2, -h / 2, w, h, 18);
  g.fill();
  g.shadowBlur = 0;
  g.strokeStyle = 'rgba(255,181,71,0.55)';
  g.lineWidth = 1.5;
  g.stroke();
  g.font = '700 118px "Courier New", monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'ltr';
  g.fillStyle = 'rgba(255,181,71,0.07)';
  g.fillText('88:88', 0, 14);
  g.shadowColor = 'rgba(255,150,40,0.9)';
  g.shadowBlur = 22;
  g.fillStyle = color;
  g.fillText(str, 0, 14);
  g.shadowBlur = 0;
  g.fillStyle = 'rgba(0,0,0,0.18)';
  for (let y = -h / 2; y < h / 2; y += 4) g.fillRect(-w / 2, y, w, 2);
  if (label) {
    g.font = '500 17px Rubik, sans-serif'; g.direction = 'rtl';
    g.fillStyle = '#d9a35a';
    g.fillText(label, 0, -h / 2 + 22);
  }
  g.restore();
}

/** The seven-layer tower. state(i) -> {lit 0..1, corrupt 0..1, fixed 0..1} */
function tower(t, cx, baseY, state, alpha = 1) {
  if (alpha <= 0) return;
  const w = 560, sh = 50, gap = 16, depth = 34;
  for (let i = 0; i < 7; i++) {
    const st = state(i);
    const y = baseY - i * (sh + gap);
    const x = cx - w / 2;
    const jitter = st.corrupt > 0.05 ? (Math.sin(t * 53 + i * 7) > 0.5 ? (Math.sin(t * 91 + i) * 14 * st.corrupt) : 0) : 0;
    g.save();
    g.globalAlpha = alpha;
    g.translate(jitter, 0);
    // colours
    const base = [30, 44, 58];
    const teal = [63, 208, 224], amber = [255, 160, 60], red = [239, 109, 115], green = [101, 205, 170];
    let edge = base.map((c, k) => lerp(c, teal[k], st.lit));
    edge = edge.map((c, k) => lerp(c, st.corrupt > 0.5 && Math.sin(t * 20 + i) > 0 ? red[k] : amber[k], st.corrupt));
    edge = edge.map((c, k) => lerp(c, green[k], st.fixed));
    const ec = `rgb(${edge.map(Math.round).join(',')})`;
    const glowA = Math.max(st.lit * 0.55, st.corrupt * 0.6, st.fixed * 0.6);
    // top face
    g.fillStyle = `rgba(${edge.map(Math.round).join(',')},${0.08 + glowA * 0.18})`;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + depth, y - depth * 0.55); g.lineTo(x + w + depth, y - depth * 0.55); g.lineTo(x + w, y); g.closePath(); g.fill();
    // side
    g.fillStyle = 'rgba(10,16,24,0.9)';
    g.beginPath(); g.moveTo(x + w, y); g.lineTo(x + w + depth, y - depth * 0.55); g.lineTo(x + w + depth, y + sh - depth * 0.55); g.lineTo(x + w, y + sh); g.closePath(); g.fill();
    // front
    const fg = g.createLinearGradient(0, y, 0, y + sh);
    fg.addColorStop(0, `rgba(${edge.map(Math.round).join(',')},${0.12 + glowA * 0.35})`);
    fg.addColorStop(1, 'rgba(8,12,18,0.92)');
    g.fillStyle = fg;
    g.fillRect(x, y, w, sh);
    g.shadowColor = ec;
    g.shadowBlur = 18 * glowA;
    g.strokeStyle = ec;
    g.lineWidth = 2;
    g.strokeRect(x, y, w, sh);
    g.shadowBlur = 0;
    g.restore();
    const ta = alpha * (0.35 + 0.65 * Math.max(st.lit, st.fixed, st.corrupt));
    text(`LAYER ${String(i + 1).padStart(2, '0')}`, x + 22 + jitter, y + sh / 2 + 1, { size: 17, weight: 500, font: 'Rubik', color: '#9fb3c6', align: 'left', dir: 'ltr', alpha: ta, spacing: 2 });
    text(LAYERS[i][0], x + 150 + jitter, y + sh / 2 + 1, { size: 24, weight: 700, font: 'Rubik', color: '#ffffff', align: 'left', dir: 'ltr', alpha: ta });
    text(LAYERS[i][1], x + w - 24 + jitter, y + sh / 2 + 1, { size: 22, weight: 600, color: '#dfe7ee', align: 'right', alpha: ta * 0.85 });
    if (st.fixed > 0.5) {
      g.save();
      g.globalAlpha = alpha * sm((st.fixed - 0.5) * 2);
      g.strokeStyle = '#65CDAA'; g.lineWidth = 4; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x + w - 120, y + 26); g.lineTo(x + w - 110, y + 36); g.lineTo(x + w - 92, y + 15); g.stroke();
      g.restore();
    }
  }
}

function glitchFace(x, y, s, t, alpha) {
  if (alpha <= 0) return;
  const jx = Math.sin(t * 67) * 4, jy = Math.cos(t * 51) * 3;
  g.save();
  g.globalAlpha = alpha;
  g.translate(x + jx, y + jy);
  g.scale(s, s);
  g.fillStyle = '#2a1a06';
  g.shadowColor = 'rgba(255,181,71,0.8)';
  g.shadowBlur = 30;
  g.beginPath(); g.arc(0, 0, 70, 0, 6.283); g.fill();
  g.shadowBlur = 0;
  g.strokeStyle = '#FFB547'; g.lineWidth = 4; g.stroke();
  g.font = '700 54px Rubik, monospace'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'ltr';
  g.fillStyle = 'rgba(239,109,115,0.7)'; g.fillText('>_<', 3, 2);
  g.fillStyle = 'rgba(63,208,224,0.6)'; g.fillText('>_<', -3, -1);
  g.fillStyle = '#FFB547'; g.fillText('>_<', 0, 0);
  g.restore();
  text('GLITCH', x + jx, y + 98 * s, { size: 20, font: 'Rubik', weight: 700, color: '#FFB547', dir: 'ltr', alpha, spacing: 4 });
}

function glitchSlices(t, amount) {
  if (amount <= 0.01) return;
  const r = rng(Math.floor(t * 24) + 11);
  const n = Math.floor(3 + amount * 8);
  for (let i = 0; i < n; i++) {
    const y = r() * H, h = 4 + r() * 26, dx = (r() - 0.5) * 60 * amount;
    g.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = `rgba(255,120,60,${0.05 * amount})`;
  g.fillRect(0, 0, W, H);
  g.restore();
}

function iconRow(t) {
  // "explore, solve, fix" – appear on the words
  const items = [['חוקרים', 22.0, 'search'], ['פותרים', 22.75, 'puzzle'], ['מתקנים', 23.55, 'wrench']];
  items.forEach(([label, at, kind], k) => {
    const a = sm(seg(t, at, at + 0.35)) * (1 - sm(seg(t, 25.3, 25.8)));
    if (a <= 0) return;
    const x = 270 - k * 0 , y = 250 + k * 92;
    const pop = 0.85 + 0.15 * eo(seg(t, at, at + 0.35));
    g.save();
    g.globalAlpha = a;
    g.translate(x, y);
    g.scale(pop, pop);
    g.fillStyle = 'rgba(14,26,38,0.85)';
    roundRect(-120, -34, 240, 68, 16); g.fill();
    g.strokeStyle = kind === 'wrench' ? '#65CDAA' : '#3FD0E0'; g.lineWidth = 2; g.stroke();
    g.strokeStyle = kind === 'wrench' ? '#65CDAA' : '#7fe6f0'; g.lineWidth = 3; g.lineCap = 'round';
    const ix = 78;
    if (kind === 'search') { g.beginPath(); g.arc(ix - 4, -4, 11, 0, 6.283); g.stroke(); g.beginPath(); g.moveTo(ix + 4, 4); g.lineTo(ix + 13, 13); g.stroke(); }
    if (kind === 'puzzle') { g.strokeRect(ix - 13, -13, 26, 26); g.beginPath(); g.arc(ix, -13, 5, Math.PI, 0); g.stroke(); }
    if (kind === 'wrench') { g.beginPath(); g.moveTo(ix - 12, 12); g.lineTo(ix + 6, -6); g.stroke(); g.beginPath(); g.arc(ix + 9, -9, 7, 0.6, 5.2); g.stroke(); }
    g.restore();
    text(label, x + 30, y + 1, { size: 28, weight: 700, alpha: a });
  });
}

/* ---------- the frame ---------- */
function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  const corruptScene = t > CUTS[2] && t < CUTS[3];
  background(t, corruptScene && t < 23.7 ? 1 : 0);

  /* camera: a slow drift on everything */
  const camS = 1 + 0.035 * Math.sin(t * 0.21) + (t < CUTS[0] ? 0.05 * seg(t, 0, CUTS[0]) : 0);
  g.setTransform(camS, 0, 0, camS, W / 2 * (1 - camS), H / 2 * (1 - camS));

  // ===== S1: Ping materialises ===== 0 – 4.2
  if (t < CUTS[0] + 0.5) {
    const a = win(t, -1, CUTS[0] + 0.5, 0.5) * sm(seg(t, 0, 0.8));
    gridFloor(t, a);
    streams(t, a * 0.8);
    dust(t, a);
    projector(W / 2, 606, 1, t, a);
    const rev = eo(seg(t, 0.55, 2.0));
    const bob = Math.sin(t * 1.4) * 4;
    drawPing('front', W / 2, 598 + bob, 500, { alpha: a, reveal: rev, t });
    if (t > 2.2) text('PING', W / 2 + 230, 300, { size: 22, font: 'Rubik', weight: 700, color: '#ef8a80', dir: 'ltr', spacing: 8, alpha: a * sm(seg(t, 2.2, 2.8)) });
  }

  // ===== S2: the stuck file ===== 4.2 – 12.8
  if (t > CUTS[0] - 0.5 && t < CUTS[1] + 0.5) {
    const a = win(t, CUTS[0] - 0.4, CUTS[1] + 0.4, 0.45);
    dust(t, a * 0.7);
    gridFloor(t, a * 0.6);
    const p0 = [1000, 470], p1 = [820, 310], p2 = [460, 310], p3 = [250, 470]; // RTL: from right (Noa) to left (lecturer)
    // highway
    g.save();
    g.globalAlpha = a;
    g.lineCap = 'round';
    g.strokeStyle = 'rgba(63,208,224,0.18)'; g.lineWidth = 14;
    g.beginPath(); g.moveTo(...p0); g.bezierCurveTo(...p1, ...p2, ...p3); g.stroke();
    g.strokeStyle = 'rgba(160,240,248,0.8)'; g.lineWidth = 2.5;
    g.setLineDash([16, 14]); g.lineDashOffset = -t * 60;
    g.beginPath(); g.moveTo(...p0); g.bezierCurveTo(...p1, ...p2, ...p3); g.stroke();
    g.setLineDash([]);
    g.restore();
    nodeIcon(p0[0], p0[1], 'נועה', 'laptop', t, a);
    nodeIcon(p3[0], p3[1], 'המרצה', 'cap', t, a);
    const stuckAt = 6.7;
    const k = t < stuckAt ? 0.52 * eo(seg(t, 4.7, stuckAt)) : 0.52;
    const [fx, fy] = bez(p0, p1, p2, p3, k);
    const stuck = t >= stuckAt;
    const jit = stuck ? Math.sin(t * 70) * 5 * (1 - sm(seg(t, stuckAt + 1.2, stuckAt + 2.4)) * 0.7) : 0;
    fileIcon(fx, fy - 8, 1.25, stuck && Math.sin(t * 9) > -0.6, a, jit);
    if (stuck) {
      const sa = a * sm(seg(t, stuckAt, stuckAt + 0.25));
      text('נתקע!', fx, fy - 82, { size: 34, weight: 800, color: '#ef6d73', alpha: sa, glow: 18 });
      text('עבודה_סופית.pdf', fx, fy + 52, { size: 18, weight: 500, color: '#f2c3c5', alpha: sa });
      g.save(); g.globalAlpha = sa * 0.5; g.strokeStyle = '#ef6d73'; g.lineWidth = 2;
      const ring = (t - stuckAt) % 1.2 / 1.2;
      g.beginPath(); g.arc(fx, fy - 8, 40 + ring * 60, 0, 6.283); g.globalAlpha = sa * (1 - ring) * 0.7; g.stroke(); g.restore();
    }
    // midnight clock
    const ca = a * sm(seg(t, 9.0, 9.5));
    ledBox(W / 2, 112, '23:30', 0.62 + 0.04 * eo(seg(t, 9.0, 9.6)), ca, { label: 'השעה עכשיו' });
    if (t > 9.9) text('עוד 30 דקות לחצות', W / 2, 188, { size: 24, weight: 700, color: '#FFB547', alpha: a * sm(seg(t, 9.9, 10.4)), glow: 10 });
    // Ping watching from the side
    const pa = a * sm(seg(t, CUTS[0] + 0.1, CUTS[0] + 0.7));
    projector(1150, 690, 0.55, t, pa * 0.9);
    drawPing('left34', 1150, 686, 360, { alpha: pa, t });
  }

  // ===== S3: seven layers light up ===== 12.8 – 19.45 (tower stays through S4)
  if (t > CUTS[1] - 0.5 && t < CUTS[3] + 0.5) {
    const a = win(t, CUTS[1] - 0.4, CUTS[3] + 0.4, 0.45);
    gridFloor(t, a * 0.8, corruptScene && t < 23.7 ? '255,160,60' : '63,208,224');
    dust(t, a * 0.6);
    const rise = eo(seg(t, CUTS[1], CUTS[1] + 3.5));
    const baseY = lerp(700, 556, rise);
    const state = (i) => {
      const lit = sm(seg(t, LIGHT_T(i), LIGHT_T(i) + 0.35));
      const corrupt = sm(seg(t, 19.65 + i * 0.05, 19.95 + i * 0.05)) * (1 - sm(seg(t, REPAIR_T(i), REPAIR_T(i) + 0.3)));
      const fixed = sm(seg(t, REPAIR_T(i), REPAIR_T(i) + 0.3));
      return { lit, corrupt, fixed };
    };
    tower(t, 760, baseY, state, a);
    // Ping presenting the tower
    const pa = a * sm(seg(t, CUTS[1] + 0.2, CUTS[1] + 0.9));
    projector(220, 690, 0.62, t, pa);
    const turn = sm(seg(t, 13.4, 13.9)) * (1 - sm(seg(t, 20.0, 20.5)));
    drawPingTurn('front', 'right34', turn, 220, 684, 440, { alpha: pa, t });
  }

  // ===== S4 overlays: Glitch + explore / solve / fix =====
  if (corruptScene || (t > CUTS[2] - 0.2 && t < CUTS[3] + 0.4)) {
    const ga = sm(seg(t, 19.55, 19.9)) * (1 - sm(seg(t, 23.9, 24.6)));
    glitchFace(1060, 150, 0.9, t, ga);
    iconRow(t);
    if (t > 23.75 && t < 25.6) text('תוקן', 1060, 150, { size: 46, weight: 800, color: '#65CDAA', alpha: sm(seg(t, 24.4, 24.8)) * (1 - sm(seg(t, 25.4, 25.8))), glow: 16 });
  }

  // ===== S5: Ping close-up ===== 25.8 – 29.2
  if (t > CUTS[3] - 0.4 && t < CUTS[4] + 0.5) {
    const a = win(t, CUTS[3] - 0.3, CUTS[4] + 0.45, 0.4);
    const bokeh = rng(3);
    g.save();
    for (let i = 0; i < 26; i++) {
      const x = bokeh() * W, y = bokeh() * H, r = 10 + bokeh() * 40;
      const rg = g.createRadialGradient(x, y + Math.sin(t + i) * 8, 0, x, y, r);
      rg.addColorStop(0, `rgba(${i % 3 ? '239,138,128' : '63,208,224'},${0.12 * a})`);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    g.restore();
    const h = lerp(1480, 1600, seg(t, CUTS[3], CUTS[4] + 0.5));
    drawPing('front', W / 2 + 10, h - 70 + Math.sin(t * 1.2) * 6, h, { alpha: a, t, glow: 1.4 });
    // soft rim light
    g.save();
    const rim = g.createRadialGradient(W / 2, 200, 50, W / 2, 260, 520);
    rim.addColorStop(0, `rgba(255,170,150,${0.10 * a})`);
    rim.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rim; g.fillRect(0, 0, W, H);
    g.restore();
  }

  // ===== S6: the clock starts ===== 29.2 – end
  if (t > CUTS[4] - 0.4) {
    const a = sm(seg(t, CUTS[4] - 0.3, CUTS[4] + 0.4));
    gridFloor(t, a * 0.9);
    streams(t, a * 0.9);
    dust(t, a);
    const startTick = 31.0;
    const secs = 1800 - Math.max(0, Math.floor(t - startTick + 1)) * (t >= startTick ? 1 : 0);
    const mm = String(Math.floor(secs / 60)).padStart(2, '0');
    const ss = String(secs % 60).padStart(2, '0');
    const pulse = t >= startTick ? 1 + 0.025 * Math.max(0, 1 - ((t - startTick) % 1) * 4) : 1;
    ledBox(W / 2, 330, `${mm}:${ss}`, (0.9 + 0.1 * eo(seg(t, 29.6, 30.2))) * pulse, a * sm(seg(t, 29.6, 30.1)), { label: 'הזמן שלכם' });
    text('הקובץ התקוע', W / 2, 150, { size: 76, weight: 800, alpha: a * sm(seg(t, 32.1, 32.7)), glow: 24, glowColor: 'rgba(63,208,224,0.6)' });
    // the call to action
    const ca = sm(seg(t, 33.0, 33.4));
    if (ca > 0) {
      g.save();
      g.globalAlpha = ca;
      const s = 0.9 + 0.1 * eo(seg(t, 33.0, 33.5));
      g.translate(W / 2, 500); g.scale(s, s);
      g.shadowColor = 'rgba(63,208,224,0.8)'; g.shadowBlur = 30 + 10 * Math.sin(t * 6);
      g.fillStyle = '#3FD0E0';
      roundRect(-150, -36, 300, 72, 16); g.fill();
      g.restore();
      text('יוצאים לדרך', W / 2, 501, { size: 34, weight: 800, color: '#062026', alpha: ca });
    }
    const pa = a * sm(seg(t, CUTS[4] + 0.2, CUTS[4] + 0.9));
    projector(1130, 690, 0.55, t, pa);
    drawPingTurn('front', 'left34', sm(seg(t, 33.0, 33.5)), 1130, 685, 380, { alpha: pa, t });
  }

  g.setTransform(1, 0, 0, 1, 0, 0);

  // glitch post-effects
  const gl = Math.max(
    sm(seg(t, 6.7, 6.8)) * (1 - sm(seg(t, 6.8, 7.4))),
    sm(seg(t, 19.55, 19.7)) * (1 - sm(seg(t, 21.2, 22.0))) * 0.9,
    corruptScene && t < 23.7 ? 0.18 : 0,
  );
  glitchSlices(t, gl);

  // cut flashes
  for (const c of CUTS) {
    const f = Math.max(0, 1 - Math.abs(t - c) / 0.22);
    if (f > 0) {
      g.save();
      g.globalCompositeOperation = 'lighter';
      g.fillStyle = `rgba(120,230,240,${0.22 * f})`;
      g.fillRect(0, 0, W, H);
      g.fillStyle = `rgba(255,255,255,${0.5 * f})`;
      g.fillRect(0, H / 2 - 1 - f * 3, W, 2 + f * 6);
      g.restore();
    }
  }
  // final flash + fade
  const fin = Math.max(0, 1 - Math.abs(t - 35.4) / 0.35);
  if (fin > 0) { g.fillStyle = `rgba(200,245,250,${0.5 * fin})`; g.fillRect(0, 0, W, H); }

  // vignette + grain
  const vg = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.62)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const gr = rng(Math.floor(t * FPS) + 99);
  g.fillStyle = 'rgba(255,255,255,0.025)';
  for (let i = 0; i < 900; i++) g.fillRect(gr() * W, gr() * H, 1, 1);

  subtitles(t);

  // fade from / to black
  const black = Math.max(1 - sm(seg(t, 0, 0.6)), sm(seg(t, 35.6, 36.5)));
  if (black > 0) { g.fillStyle = `rgba(0,0,0,${black})`; g.fillRect(0, 0, W, H); }
}

/* ------------------------------------------------------------------
   Music + sound effects (rendered offline, deterministic)
------------------------------------------------------------------- */
async function renderAudio() {
  const SR = 48000;
  const ac = new OfflineAudioContext(2, Math.ceil(DUR * SR), SR);
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.connect(master);
  const out = comp;
  const noiseBuf = ac.createBuffer(1, SR * 2, SR);
  { const d = noiseBuf.getChannelData(0); const r = rng(5); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; }
  const tone = (f, t0, dur, { type = 'sine', vol = 0.2, a = 0.01, r = 0.2, f2, dest = out, detune = 0 } = {}) => {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t0); o.detune.value = detune;
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    const gn = ac.createGain(); gn.gain.setValueAtTime(0, t0); gn.gain.linearRampToValueAtTime(vol, t0 + a);
    gn.gain.setValueAtTime(vol, t0 + Math.max(a, dur - r)); gn.gain.linearRampToValueAtTime(0, t0 + dur);
    o.connect(gn); gn.connect(dest); o.start(t0); o.stop(t0 + dur + 0.05);
  };
  const noise = (t0, dur, { vol = 0.2, from = 400, to = 3000, q = 1, type = 'bandpass', a = 0.05 } = {}) => {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    const gn = ac.createGain(); gn.gain.setValueAtTime(0, t0); gn.gain.linearRampToValueAtTime(vol, t0 + a); gn.gain.linearRampToValueAtTime(0, t0 + dur);
    s.connect(f); f.connect(gn); gn.connect(out); s.start(t0); s.stop(t0 + dur + 0.05);
  };

  // --- pad: slow chords under the whole thing
  const padBus = ac.createBiquadFilter(); padBus.type = 'lowpass'; padBus.frequency.value = 1100; padBus.Q.value = 0.7;
  const padGain = ac.createGain(); padGain.gain.value = 0.55; padBus.connect(padGain); padGain.connect(out);
  const chords = [[220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7], [164.8, 207.7, 246.9], [220, 261.6, 329.6], [174.6, 220, 261.6], [261.6, 329.6, 392], [196, 246.9, 293.7]];
  const step = DUR / chords.length;
  chords.forEach((ch, i) => ch.forEach((f) => {
    const t0 = i * step;
    tone(f / 2, t0, step + 1.2, { type: 'sawtooth', vol: 0.028, a: 1.0, r: 1.2, dest: padBus, detune: -7 });
    tone(f / 2, t0, step + 1.2, { type: 'sawtooth', vol: 0.028, a: 1.0, r: 1.2, dest: padBus, detune: 7 });
    tone(f, t0, step + 1.2, { type: 'triangle', vol: 0.02, a: 1.2, r: 1.2, dest: padBus });
  }));
  // sub drone
  tone(55, 0, DUR, { type: 'sine', vol: 0.07, a: 2, r: 2 });
  // soft arpeggio sparkle in scene 3
  [440, 523.3, 659.3, 784, 880, 1046.5, 1318.5].forEach((f, i) => tone(f, LIGHT_T(i), 0.6, { type: 'triangle', vol: 0.05, a: 0.005, r: 0.5 }));
  // pulse that builds into the clock
  for (let t = 12.8; t < 19.4; t += 0.5) tone(70, t, 0.22, { vol: 0.12, f2: 40, a: 0.004, r: 0.2 });
  for (let t = 29.2; t < 35.4; t += 0.5) tone(65, t, 0.25, { vol: 0.2, f2: 38, a: 0.004, r: 0.22 });

  // --- effects
  tone(180, 0.55, 1.5, { type: 'sine', vol: 0.1, f2: 880, a: 0.3, r: 0.5 });               // materialise
  noise(0.6, 1.4, { vol: 0.06, from: 2000, to: 8000, q: 2, a: 0.4 });
  CUTS.forEach((c) => noise(c - 0.35, 0.7, { vol: 0.18, from: 300, to: 4000, q: 0.8, a: 0.3 })); // whooshes
  const glitchAt = (t0, len, vol) => {
    const r = rng(Math.floor(t0 * 100));
    for (let t = t0; t < t0 + len; t += 0.045 + r() * 0.05) { if (r() > 0.35) noise(t, 0.035, { vol, from: 800 + r() * 4000, to: 600, q: 3, a: 0.003 }); }
    tone(82, t0, Math.min(0.5, len), { type: 'square', vol: vol * 0.35, a: 0.005, r: 0.1 });
  };
  glitchAt(6.7, 0.7, 0.22);                                                                 // file stalls
  tone(660, 6.75, 0.25, { type: 'square', vol: 0.05 }); tone(520, 7.0, 0.35, { type: 'square', vol: 0.05 }); // error blip
  tone(988, 9.0, 0.12, { type: 'sine', vol: 0.08 }); tone(988, 9.25, 0.12, { type: 'sine', vol: 0.08 });     // clock beep
  glitchAt(19.55, 1.6, 0.25);                                                               // Glitch arrives
  [22.0, 22.75, 23.55].forEach((t, i) => tone(600 + i * 150, t, 0.18, { type: 'triangle', vol: 0.08 }));
  [523.3, 659.3, 784, 1046.5, 1318.5].forEach((f, i) => tone(f, 23.75 + i * 0.12, 0.6, { type: 'triangle', vol: 0.09 })); // repair
  for (let t = 31.0; t < 35.4; t += 1) noise(t, 0.04, { vol: 0.2, from: 5000, to: 3000, q: 4, a: 0.002, type: 'bandpass' }); // ticks
  tone(48, 35.4, 1.2, { vol: 0.35, f2: 30, a: 0.005, r: 1.0 });                             // final hit
  noise(35.4, 1.2, { vol: 0.14, from: 6000, to: 800, q: 0.6, a: 0.01 });

  const buf = await ac.startRendering();
  // encode 16-bit WAV
  const n = buf.length, ch = 2, bytes = 44 + n * ch * 2;
  const ab = new ArrayBuffer(bytes); const dv = new DataView(ab);
  const ws = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  ws(0, 'RIFF'); dv.setUint32(4, bytes - 8, true); ws(8, 'WAVE'); ws(12, 'fmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, ch, true); dv.setUint32(24, SR, true); dv.setUint32(28, SR * ch * 2, true);
  dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, n * ch * 2, true);
  const L = buf.getChannelData(0), Rr = buf.getChannelData(1);
  let o = 44;
  for (let i = 0; i < n; i++) { dv.setInt16(o, clamp(L[i], -1, 1) * 32767, true); dv.setInt16(o + 2, clamp(Rr[i], -1, 1) * 32767, true); o += 4; }
  return ab;
}

/* ------------------------------------------------------------------ */
async function boot() {
  await Promise.all([document.fonts.load('700 40px Heebo'), document.fonts.load('600 40px Heebo'), document.fonts.load('800 40px Heebo'), document.fonts.load('700 40px Rubik'), document.fonts.load('500 40px Rubik')]);
  await document.fonts.ready;
  const names = { front: 'ping-front.webp', left34: 'ping-left34.webp', right34: 'ping-right34.webp' };
  await Promise.all(Object.entries(names).map(([k, f]) => new Promise((res) => { const im = new Image(); im.onload = () => { IMG[k] = im; res(); }; im.src = '/ping/' + f; })));
  TL = await (await fetch('timeline.json')).json();
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { draw(parseFloat(q.get('t'))); statusEl.textContent = 't=' + q.get('t'); window.READY = true; return; }
  if (q.has('play')) { const t0 = performance.now(); const loop = () => { const t = (performance.now() - t0) / 1000; draw(t % DUR); requestAnimationFrame(loop); }; loop(); return; }
  if (q.has('render')) {
    const N = Math.round(DUR * FPS);
    for (let n = 0; n < N; n++) {
      draw(n / FPS);
      const blob = await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.93));
      await fetch('/frame?n=' + n, { method: 'POST', body: blob });
      if (n % 15 === 0) statusEl.textContent = `frame ${n}/${N}`;
    }
    statusEl.textContent = 'audio…';
    const wav = await renderAudio();
    await fetch('/audio', { method: 'POST', body: wav });
    await fetch('/done', { method: 'POST', body: String(N) });
    statusEl.textContent = 'DONE ' + N;
  }
  window.READY = true;
}
window.drawAt = (t) => draw(t);
boot();
